# Alembic configuration for Vecna memory substrate

[alembic]
script_location = vecna/migrations
prepend_sys_path = .
version_path_separator = os

# SQLAlchemy URL - override via environment variable VECNA_PG_URL
sqlalchemy.url = postgresql://vecna:vecna@localhost:5432/vecna

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
