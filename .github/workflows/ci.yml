name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,postgres]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: vecna
          POSTGRES_PASSWORD: vecna
          POSTGRES_DB: vecna
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vecna -d vecna"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      VECNA_PG_URL: postgresql://vecna:vecna@localhost:5432/vecna
      VECNA_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev,postgres,local]"
      - name: Debug alembic config
        run: |
          pwd
          ls -la
          echo "--- alembic.ini ---"
          cat "$GITHUB_WORKSPACE/alembic.ini"
          echo "--- alembic config (parsed) ---"
          alembic -c "$GITHUB_WORKSPACE/alembic.ini" current || true
      - name: Install database schema
        run: alembic -c "$GITHUB_WORKSPACE/alembic.ini" upgrade head
      - name: Run unit tests
        run: pytest -v -m "not requires_docker and not requires_copilot and not requires_langfuse"
