[pytest]
asyncio_mode = auto
testpaths = ["tests"]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

markers =
    unit: Fast unit tests (no external services required)
    integration: Tests requiring PostgreSQL, Redis, or Docker
    e2e: End-to-end CLI/TUI tests
    slow: Tests that take >5 seconds
    requires_docker: Tests requiring Docker daemon
    requires_copilot: Tests requiring GitHub Copilot authentication
    requires_postgres: Tests requiring PostgreSQL connection
    requires_redis: Tests requiring Redis connection
    requires_openai: Tests requiring OpenAI API key for embeddings

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
